name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "FotoLoco-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FotoLoco-${{ github.run_number }}
          path: FotoLoco-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Foto Loco build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: FotoLoco-*.apk
          make_latest: true
          body: |
            Download the `.apk` below on your Android phone and open it to install.
